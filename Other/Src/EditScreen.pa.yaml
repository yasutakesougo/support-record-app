            Item: =varRecord
            NumberOfColumns: =1
            OnFailure: |-
              =Notify(
                  "保存に失敗しました。もう一度お試しください。", 
                  NotificationType.Error, 
                  5000
              )
            OnSuccess: |-
              =Notify("保存が完了しました！", NotificationType.Success, 5000);

