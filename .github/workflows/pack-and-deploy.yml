`11
cd ~/projects/CanvasAppSrc
nano .github/workflows/pack-and-deploy.ymlcd ~/projects/CanvasAppSrc
nano .github/workflows/pack-and-deploy.y
    - name: Init Solution
      run: pac solution init --publisher-name "YourPublisherName" --publisher-prefix yp --outputDirectory SupportRecordSolution

    - name: Build Solution
      run: |
        cd SupportRecordSolution
        dotnet build SupportRecordSolution.cdsproj --configuration Debug

    - name: Import Solution to Dataverse
      run: |
        pac auth select --name default
        pac solution import \
          --path SupportRecordSolution/bin/Debug/SupportRecordSolution.zip \
          --environment ${{ secrets.PP_ENVIRONMENT }} \
          --publish-changes
