HomeScreen As screen:
    OnVisible: |-
        =Set(varShowForm, false);
        Set(varSelectedDate, Today());
        Set(varRecord, Defaults(SupportRecord_DBs));
        Refresh(SupportRecord_DBs);
        Refresh('支援手順_TEMPL'); // ←追加すると初回表示も安定します

    Rectangle4_1 As rectangle:
        Fill: =RGBA(209, 232, 178, 1)
        Height: =80
        Width: =1024
        ZIndex: =1

    "Gallery2 As gallery.'BrowseLayout_Vertical_ThreeTextVariant_ver5.0'":
        DelayItemLoading: =true
        Height: =335
        Items: |-
            =AddColumns(
              SortByColumns(
                Filter(
                  '支援手順_TEMPL',
                  cr013_userlookupid = varSelectedUser.UserID
                ),
                "cr013_rowno",
                If(SortDescending1, SortOrder.Descending, SortOrder.Ascending)
              ),
              "RecordToday",
              IfError(
                LookUp(
                  SupportRecord_DBs,
                  cr013_userlookupid = varSelectedUser.UserID &&
                  cr013_rowno        = ThisRecord.cr013_rowno &&
                  cr013_field_1      = varSelectedDate
                ),
                Blank()
              )
            )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        TemplateFill: |-
            =If(
                !IsBlank(ThisItem.RecordToday) && !IsBlank(ThisItem.RecordToday.cr013_field_7),
                RGBA(232, 245, 233, 1),
                RGBA(255, 235, 238, 1)
            )
        TemplatePadding: =0
        TemplateSize: =168
        Width: =588
        X: =430
        Y: =145
        ZIndex: =1

        Title2 As label:
            Color: =RGBA(0, 18, 107, 1)
            FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
            Height: =25
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0.00
            PaddingTop: =0.00
            Size: =12
            Text: =ThisItem.時間帯
            VerticalAlign: =VerticalAlign.Top
            Width: =71
            X: =15
            Y: =1
            ZIndex: =1

        Subtitle2 As label:
            Color: =RGBA(0, 18, 107, 1)
            FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
            Height: =26
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0.00
            PaddingTop: =0.00
            Size: =16
            Text: =ThisItem.活動
            VerticalAlign: =VerticalAlign.Top
            Width: =178
            X: =15
            Y: =30
            ZIndex: =2

        Body1 As label:
            Color: =RGBA(0, 18, 107, 1)
            FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
            Height: =23
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0.00
            PaddingTop: =0.00
            Size: =14
            Text: =ThisItem.本人
            VerticalAlign: =VerticalAlign.Top
            Width: =220
            X: =15
            Y: =63
            ZIndex: =3

        NextArrow2 As icon.ChevronRight:
            AccessibleLabel: =Self.Tooltip
            Color: =RGBA(54, 176, 75, 1)
            Height: =81
            Icon: =Icon.Compose
            OnSelect: |-
                =// ① 当日分の既存レコードを検索
                Set(
                  varExisting,
                  LookUp(
                    SupportRecord_DBs,
                    cr013_userlookupid = varSelectedUser.UserID
                    && cr013_rowno      = ThisItem.cr013_rowno
                    && cr013_field_1    = varSelectedDate
                  )
                );
                
                // ② 新規モードかどうかを判定
                Set(varIsNew, IsBlank(varExisting));
                
                // ③ varRecord に既存 or 新規プレースホルダをセット
                Set(
                  varRecord,
                  If(
                    varIsNew,
                    {
                      cr013_userlookupid: varSelectedUser.UserID,
                      cr013_rowno       : ThisItem.cr013_rowno,
                      cr013_field_1     : varSelectedDate,
                      cr013_field_3     : ThisItem.時間帯,
                      cr013_field_4     : ThisItem.活動,
                      cr013_field_5     : ThisItem.本人,
                      cr013_field_6     : ThisItem.支援者
                    },
                    varExisting
                  )
                );
                
                // ④ フォームを開く
                Set(varShowForm, true);
                Navigate(EditScreen, ScreenTransition.None);
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =11.99
            PaddingTop: =11.99
            Tooltip: ="項目の詳細の表示"
            Width: =99
            X: =489
            Y: =26
            ZIndex: =4

        Separator1 As rectangle:
            Height: =8
            OnSelect: =Select(Parent)
            Width: =385.31
            X: =0.00
            Y: =Parent.TemplateHeight - Self.Height
            ZIndex: =5

        Rectangle3 As rectangle:
            Height: =Parent.TemplateHeight - Separator1.Height
            OnSelect: =Select(Parent)
            Visible: =ThisItem.IsSelected
            Width: =3.00
            X: =0.00
            ZIndex: =6

        Label14 As label:
            Align: =Align.Center
            Color: =RGBA(54, 176, 75, 1)
            FontWeight: =FontWeight.Semibold
            Height: =36
            OnSelect: =Select(Parent)
            Size: =12
            Text: |-
