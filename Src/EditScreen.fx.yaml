                "保存に失敗しました。もう一度お試しください。", 
                NotificationType.Error, 
                5000
            )
        OnSuccess: |-
            =Notify("保存が完了しました！", NotificationType.Success, 5000);
            
            // 更新を反映（Gallery2.Itemsが参照する日付・ユーザーをもとに再構成）
            Set(
                varSupportRecordsToday,
                Filter(
                    SupportRecord_DBs,
                    cr013_userlookupid = varSelectedUser.UserID &&
                    cr013_field_1 = varSelectedDate
                )
            );
            
            // 強制的にGallery2再描画（Gallery2.Itemsに再評価が走るよう）
            Set(varShowForm, false); // フォーム非表示
            Reset(Gallery2);         // Gallery強制リセット
